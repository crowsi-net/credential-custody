[package]
categories = ["authentication", "os"]
keywords = ["credentials", "authorization", "contracts", "security", "rust"]
exclude = ["/registration/**", "/state/**", "/.local/**", "/.state/**", "/.data/**", "/secrets/**", "/credentials/**", "/.env", "/.env.production", "/.env.local", "/*.tgz", "/*.tar.gz", "/*.tar", "/*.zip", "/*.whl", "/*.crate", "/.ruff_cache/**", "/.mypy_cache/**", "/.tox/**", "/.nox/**", "/.hypothesis/**", "/.coverage", "/.coverage.*", "/htmlcov/**", "/lcov.info", "/junit.xml", "/*.profraw", "/*.profdata", "/*.egg-info/**", "/target/**", "/node_modules/**", "/dist/**", "/build/**", "/.cache/**", "/.pytest_cache/**", "/coverage/**"]
name = "crowsi-credential-authority-contracts"
version = "0.10.0"
edition = "2024"
rust-version = "1.97"
description = "Public verification contracts for Crowsi credential custody"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/crowsi-net/credential-custody"
publish = ["crates-io"]
autotests = false

[dependencies]
ed25519-dalek = "=3.0.0"
hex = "=0.4.3"
ihat-identity-assertion-contracts = { version = "=0.10.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
todo = "deny"

[[test]]
name = "contracts"
path = "tests/contracts.rs"

[[test]]
name = "management"
path = "tests/management.rs"
