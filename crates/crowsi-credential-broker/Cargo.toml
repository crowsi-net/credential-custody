[package]
exclude = ["/registration/**", "/state/**", "/.local/**", "/.state/**", "/.data/**", "/secrets/**", "/credentials/**", "/.env", "/.env.production", "/.env.local", "/*.tgz", "/*.tar.gz", "/*.tar", "/*.zip", "/*.whl", "/*.crate", "/.ruff_cache/**", "/.mypy_cache/**", "/.tox/**", "/.nox/**", "/.hypothesis/**", "/.coverage", "/.coverage.*", "/htmlcov/**", "/lcov.info", "/junit.xml", "/*.profraw", "/*.profdata", "/*.egg-info/**", "/target/**", "/node_modules/**", "/dist/**", "/build/**", "/.cache/**", "/.pytest_cache/**", "/coverage/**"]
name = "crowsi-credential-broker"
version = "0.1.2"
edition = "2024"
rust-version = "1.97"
description = "Fail-closed local credential references, leases, and metadata-only status contracts"
license = "Apache-2.0"
readme = "README.md"
publish = ["crates-io"]
autotests = false
autobins = false
repository = "https://github.com/crowsi-net/credential-custody"

[package.metadata.crowsi]
boundary = "credential-custody"
status-schema = "crowsi://credentials/status/v1"
status-contains-secret-values = false


[dependencies]
crowsi-control-contracts = { version = "=0.1.0" }
crowsi-windows-custody-provider = { version = "=0.10.2", path = "../crowsi-windows-custody-provider", optional = true }
getrandom = "0.3.4"
hex = "0.4.3"
nix = { version = "0.29.0", features = ["poll"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.18"
zeroize = "1.8.2"

[features]
default = ["windows-custody"]
windows-custody = ["dep:crowsi-windows-custody-provider"]
linux-secret-service = ["dep:libsecret", "dep:glib", "dep:gio"]

[target.'cfg(target_os = "linux")'.dependencies]
libsecret = { version = "0.9.0", optional = true }
glib = { version = "0.22.0", optional = true }
gio = { version = "0.22.0", optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[[test]]
name = "contracts"
path = "tests/harnesses/contracts.rs"

[[test]]
name = "ipc"
path = "tests/harnesses/ipc.rs"

[[test]]
name = "linux-secret-service"
path = "tests/linux_secret_service.rs"
required-features = ["linux-secret-service"]
