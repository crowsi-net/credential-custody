[package]
exclude = ["/registration/**", "/state/**", "/.local/**", "/.state/**", "/.data/**", "/secrets/**", "/credentials/**", "/.env", "/.env.production", "/.env.local", "/*.tgz", "/*.tar.gz", "/*.tar", "/*.zip", "/*.whl", "/*.crate", "/.ruff_cache/**", "/.mypy_cache/**", "/.tox/**", "/.nox/**", "/.hypothesis/**", "/.coverage", "/.coverage.*", "/htmlcov/**", "/lcov.info", "/junit.xml", "/*.profraw", "/*.profdata", "/*.egg-info/**", "/target/**", "/node_modules/**", "/dist/**", "/build/**", "/.cache/**", "/.pytest_cache/**", "/coverage/**"]
name = "crowsi-device-credential-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Finite verified adapter to the central Crowsi credential authority host"
license = "Apache-2.0"
publish = false
autotests = false
repository = "https://github.com/crowsi-net/credential-custody"

[features]
test-support = []


[dependencies]
crowsi-credential-authority-contracts = { version = "=0.10.0", path = "../crowsi-credential-authority-contracts" }
crowsi-authority-transport = { version = "=0.2.0", git = "https://github.com/crowsi-net/crowsi-transport-foundation", rev = "30bcd1e14cad837755cfc524097ca6133d32c8d3" }
crowsi-windows-operation-contracts = { version = "=0.1.0", path = "../crowsi-windows-operation-contracts" }
ed25519-dalek = "=3.0.0"
getrandom = "=0.2.17"
hex = "=0.4.3"
ihat-identity-assertion-contracts = { version = "=0.10.0" }
libc = "=0.2.190"
nix = { version = "=0.29.0", features = ["fs", "process", "signal"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
wait-timeout = "=0.2.1"
zeroize = { version = "=1.8.2", features = ["serde"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
missing_errors_doc = "allow"
todo = "deny"
unwrap_used = "deny"
# The orchestration API intentionally transfers owned resume records between
# durable phases. Rust 1.97's new pedantic style lints otherwise recommend
# borrowing and reshaping those state-machine boundaries without improving the
# security contract. Keep the safety/correctness lint groups enabled above and
# make these representation-only exceptions explicit.
assigning_clones = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
collapsible_if = "allow"
fn_params_excessive_bools = "allow"
iter_filter_is_ok = "allow"
large_enum_variant = "allow"
manual_let_else = "allow"
match_same_arms = "allow"
needless_pass_by_value = "allow"
op_ref = "allow"
ref_option = "allow"
replace_box = "allow"
similar_names = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
trivially_copy_pass_by_ref = "allow"
unnecessary_wraps = "allow"
unnested_or_patterns = "allow"
unused_self = "allow"

[[test]]
name = "source_limits"
path = "tests/source_limits.rs"

[[test]]
name = "management_v2_projection"
path = "tests/management_v2_projection.rs"
required-features = ["test-support"]

[[test]]
name = "production_surface"
path = "tests/production_surface.rs"
