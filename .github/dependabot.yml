version: 2
updates:
- package-ecosystem: cargo
  directories:
  - /
  schedule:
    interval: daily
    time: '05:00'
    timezone: Asia/Tokyo
  open-pull-requests-limit: 10
  groups:
    compatible-updates:
      applies-to: version-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
    security-fixes:
      applies-to: security-updates
      patterns:
      - '*'
- package-ecosystem: github-actions
  directories:
  - /
  schedule:
    interval: daily
    time: '05:00'
    timezone: Asia/Tokyo
  open-pull-requests-limit: 10
  groups:
    compatible-updates:
      applies-to: version-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
