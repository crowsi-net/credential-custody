name: Verify independent generic workspace
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97 --profile minimal --component rustfmt --component clippy
      - name: Verify preserved source history
        run: git bundle verify docs/source-history/source.bundle
      - run: cargo +1.97 fmt --all -- --check
      - run: cargo +1.97 clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo +1.97 test --locked --workspace --all-targets --all-features
      - run: cargo +1.97 test --locked --workspace --doc --all-features
