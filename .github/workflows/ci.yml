name: Verify independent generic workspace
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '20 20 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: rustup toolchain install 1.97 --profile minimal --component rustfmt --component clippy
      - name: Verify current owner provenance without restoring retired repositories
        run: |
          python3 - <<'PYCODE'
          import json, os, re, subprocess
          from pathlib import Path, PurePosixPath
          record = Path('source-consolidation.json')
          assert record.is_file() and not record.is_symlink() and record.stat().st_size <= 65536
          data = json.loads(record.read_text())
          assert data['owner_repository'] == os.environ['GITHUB_REPOSITORY']
          for component in data.get('components', []):
              assert component['owner_repository'] == data['owner_repository']
              assert re.fullmatch(r'[0-9a-f]{40}', component['source_head'])
              path = PurePosixPath(component['subpath'])
              assert not path.is_absolute() and '..' not in path.parts
              assert (Path('.') / path).is_dir()
              assert not {'history_archive', 'history_ref', 'local_history_ref'} & component.keys()
          if not data.get('components'):
              assert re.fullmatch(r'[0-9a-f]{40}', data['source_sha'])
          assert 'canonical_history_bundle' not in data
          paths = subprocess.check_output(['git', 'ls-files', '-z'], timeout=10).decode().split('\0')
          assert len(paths) <= 8192
          assert not any(p.endswith('.bundle') or 'source-history' in PurePosixPath(p).parts for p in paths if p)
          print('Current owner provenance verified; no historical repository restoration')
          PYCODE
      - name: Diagnose namespace capability without changing host protection
        run: sh scripts/acceptance/diagnose.sh
      - name: Install native keyring build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libsecret-1-dev dbus gnome-keyring
      - run: cargo +1.97 fmt --all -- --check
      - run: cargo +1.97 clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Verify reviewed local execution evidence (does not execute namespace tests)
        run: |
          node --experimental-strip-types --test scripts/acceptance/*.test.mts
          node --experimental-strip-types scripts/acceptance/local.mts verify
      - name: Run portable tests; namespace acceptance is a separate local execution
        run: node --experimental-strip-types scripts/acceptance/portable.mts
      - run: cargo +1.97 test --locked --workspace --doc --all-features
      - name: Verify isolated Linux keyring custody against the actual provider
        run: bash scripts/acceptance/linux-keyring.sh
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97 --profile minimal
      - run: cargo +1.97 install cargo-audit --version 0.22.2 --locked --no-default-features
      - run: cargo +1.97 audit --deny warnings
